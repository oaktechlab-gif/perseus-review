<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ペルセウスの試練</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: phone-first full-height column. Slim HUD on top, the board as large as the screen allows, a thumb dock (items + actions) at the bottom. Night of the underworld; bronze marks anything you can hold. */
:root {
  --night: #12172e;
  --panel: #1b2244;
  --panel-2: #242d58;
  --line: #36417a;
  --ink: #ece4cf;
  --muted: #9ba2c8;
  --bronze: #e2b04a;
  --bronze-deep: #9c6a2c;
  --blood: #d6524a;
  --sea: #62c9d8;
  --f-pix: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', monospace;
  --f-latin: 'Silkscreen', 'DotGothic16', monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-pix);
  font-size: 15px;
  line-height: 1.6;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-block: 8px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }

.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; }
.stage-line { min-width: 0; display: flex; flex-direction: column; gap: 0; }
.stage-no { font-family: var(--f-latin); font-size: 10px; letter-spacing: 0.14em; color: var(--muted); white-space: nowrap; }
.stage-name { font-size: 17px; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.tools { display: flex; gap: 6px; }
.ibtn { height: 34px; padding: 0 9px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 2px 0 #0b0f20; font-size: 12px; white-space: nowrap; }
.ibtn:active { transform: translateY(2px); box-shadow: none; }
.hearts { display: flex; gap: 4px; }
.hearts img { width: 20px; height: 17px; image-rendering: pixelated; }
.turns { font-family: var(--f-latin); font-size: 11px; color: var(--muted); letter-spacing: 0.12em; font-variant-numeric: tabular-nums; justify-self: end; }

.stage-wrap { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.board {
  position: relative;
  align-self: center;
  width: 100%;
  max-width: 100%;
  border: 3px solid var(--line);
  background: #070815;
  box-shadow: 0 0 0 3px #0b0f20, 0 8px 0 #0b0f20;
  line-height: 0;
  box-sizing: border-box;
}
.board.shake { animation: shake 0.28s steps(4); }
@keyframes shake { 25% { transform: translate(-3px, 1px); } 50% { transform: translate(3px, -1px); } 75% { transform: translate(-2px, 0); } }
#cv { width: 100%; height: auto; image-rendering: pixelated; display: block; touch-action: none; }
.boardbar { align-self: center; max-width: 100%; display: flex; align-items: center; gap: 6px; min-height: 26px; line-height: 1.5; }
.status { flex: 1; display: flex; gap: 4px; flex-wrap: wrap; pointer-events: none; }
.chip { font-size: 11px; padding: 0 6px; border: 2px solid var(--line); background: rgba(18, 23, 46, 0.86); }
.chip.helm { border-color: #7a6fb0; color: #c9c1f2; }
.chip.shield { border-color: var(--sea); color: var(--sea); }
.chip.armed { border-color: var(--bronze); color: var(--bronze); }
.chip.key { border-color: var(--bronze-deep); color: var(--bronze); }
.viewbtn { flex: none; height: 26px; padding: 0 10px; font-size: 11px; line-height: 1; background: var(--panel); border: 2px solid var(--line); }
.viewbtn.on { border-color: var(--bronze); color: var(--bronze); }
.msg { margin: 0; height: 64px; overflow-y: auto; box-sizing: border-box; padding: 6px 10px; flex: none; background: var(--panel); border-left: 4px solid var(--bronze); font-size: 13px; line-height: 1.45; }

.dock { display: flex; flex-direction: column; gap: 8px; }
.belt { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot {
  position: relative;
  background: var(--panel);
  border: 2px solid var(--line);
  box-shadow: 0 3px 0 #0b0f20;
  padding: 6px 2px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: 0;
}
.slot img { width: 32px; height: 32px; image-rendering: pixelated; }
.slot .nm { font-size: 10px; line-height: 1.3; text-align: center; color: var(--muted); }
.slot .ct { position: absolute; top: 2px; right: 5px; font-family: var(--f-latin); font-size: 11px; color: var(--bronze); }
.slot .kb { position: absolute; top: 2px; left: 5px; font-family: var(--f-latin); font-size: 10px; color: var(--muted); opacity: 0.7; }
.slot.empty { opacity: 0.38; }
.slot.empty img { filter: grayscale(1) brightness(0.7); }
.slot.on { border-color: var(--bronze); background: var(--panel-2); }
.slot.on .nm { color: var(--ink); }
.slot:not(.empty):active { transform: translateY(2px); box-shadow: 0 1px 0 #0b0f20; }

.dpad { align-self: center; display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 46px); gap: 4px; }
.dpad button { background: var(--panel-2); border: 2px solid var(--line); box-shadow: 0 3px 0 #0b0f20; font-size: 18px; }
.dpad button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b0f20; }
.dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }
.dpad .w { grid-column: 2; grid-row: 2; font-size: 11px; background: var(--panel); }
.acts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.slot.hint, .acts button.hint { border-color: var(--bronze); animation: blink 0.4s steps(2) 4; }
@keyframes blink { 50% { background: var(--bronze); color: #1b1408; } }
.acts button { height: 44px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 3px 0 #0b0f20; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; white-space: nowrap; }
.acts button span { font-family: var(--f-latin); font-size: 9px; color: var(--muted); }
.acts button.on { border-color: var(--bronze); color: var(--bronze); }
.acts button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b0f20; }
.keys { margin: 0; font-size: 11px; color: var(--muted); text-align: center; }
@media (pointer: coarse) { .keys, .slot .kb, .acts button span { display: none; } }

/* overlays */
.op { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; align-items: center; justify-content: center; }
.op[hidden] { display: none !important; }
#opCv { width: 100%; height: 100%; image-rendering: pixelated; }
.op-text { position: absolute; left: 20px; right: 20px; bottom: 16%; margin: 0; text-align: center; font-size: 17px; line-height: 1.6; color: #f7ecd2; text-shadow: 0 2px 0 #000, 0 0 10px #000; transition: opacity 0.4s; }
.op-skip { position: absolute; right: 14px; top: max(14px, env(safe-area-inset-top, 0px)); height: 34px; padding: 0 12px; font-size: 12px; background: rgba(18, 23, 46, 0.7); border: 2px solid var(--line); }
.op-hint { position: absolute; bottom: max(18px, env(safe-area-inset-bottom, 0px)); width: 100%; text-align: center; font-size: 11px; color: var(--muted); }
.chap .opbtn { margin-left: 8px; font-size: 11px; padding: 2px 8px; background: var(--panel-2); border: 2px solid var(--line); }
.title { position: fixed; inset: 0; z-index: 30; background: #070815 center / cover no-repeat; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: max(28px, env(safe-area-inset-top, 0px)) 20px max(28px, env(safe-area-inset-bottom, 0px)); }
.title[hidden] { display: none !important; }
.title-shade { position: absolute; inset: 0; background: linear-gradient(rgba(5,4,18,0.7), rgba(5,4,18,0) 32%, rgba(5,4,18,0) 60%, rgba(5,4,18,0.8)); pointer-events: none; }
.title-head { position: relative; text-align: center; margin-top: 4vh; }
.title-en { font-family: var(--f-latin); font-size: 11px; letter-spacing: 0.32em; color: var(--bronze); }
.title-ja { margin: 6px 0 0; font-size: clamp(30px, 9vw, 44px); letter-spacing: 0.08em; color: #f7ecd2; text-shadow: 0 3px 0 #2a1608, 0 0 18px rgba(255, 170, 70, 0.55); }
.title-menu { position: relative; display: flex; flex-direction: column; gap: 10px; width: min(300px, 100%); }
.title-menu button { height: 50px; font-size: 16px; background: rgba(18, 23, 46, 0.88); border: 2px solid var(--line); box-shadow: 0 3px 0 #0b0f20; }
.title-menu button.primary { border-color: var(--bronze); color: var(--bronze); }
.title-menu button:active { transform: translateY(2px); box-shadow: none; }
.stars { color: var(--bronze); letter-spacing: 0.05em; } .stars i { font-style: normal; color: var(--muted); opacity: 0.6; }
.winstars { text-align: center; font-size: 30px; line-height: 1.2; } .winstars small { display: block; font-size: 12px; color: var(--bronze); }
.veil { position: fixed; inset: 0; background: rgba(8, 10, 24, 0.78); display: flex; align-items: center; justify-content: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.card { background: var(--panel); border: 3px solid var(--bronze); box-shadow: 0 0 0 3px #0b0f20, 0 12px 0 #0b0f20; max-width: 420px; width: 100%; padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
.card .eyebrow { font-family: var(--f-latin); font-size: 11px; letter-spacing: 0.2em; color: var(--bronze); }
.card h2 { margin: 0; font-size: 26px; font-weight: 400; line-height: 1.25; text-wrap: balance; }
.card p { margin: 0; font-size: 14px; color: var(--ink); }
.card .sub { color: var(--muted); font-size: 13px; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.card .row button { flex: 1 1 140px; padding: 10px 12px; border: 2px solid var(--line); background: var(--panel-2); box-shadow: 0 3px 0 #0b0f20; }
.card .row button.primary { background: var(--bronze); border-color: var(--bronze); color: #1b1408; }
.newitem { display: flex; gap: 12px; align-items: center; background: var(--night); padding: 10px; border: 2px dashed var(--line); }
.newitem img { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
.newitem div { min-width: 0; font-size: 13px; }
.newitem b { font-weight: 400; color: var(--bronze); display: block; }
.grid-stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.grid-stages button { text-align: left; padding: 8px 10px; background: var(--panel-2); border: 2px solid var(--line); font-size: 13px; line-height: 1.35; min-width: 0; }
.grid-stages button small { display: block; font-family: var(--f-latin); font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }
.grid-stages button.cur { border-color: var(--bronze); }
.grid-stages button.boss small { color: var(--blood); }
.grid-stages button:disabled { opacity: 0.35; cursor: not-allowed; }

/* results & ranking */
.result { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.result div { background: var(--night); border: 2px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; }
.result small { font-size: 11px; color: var(--muted); }
.result b { font-family: var(--f-latin); font-weight: 700; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; }
.result i { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 2px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; padding: 2px 8px; border: 2px solid var(--sea); color: var(--sea); }
.badge.gold { border-color: var(--bronze); color: var(--bronze); background: rgba(226,176,74,0.1); }
.rankbox { border-top: 2px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.rank-title { font-size: 13px; color: var(--bronze); }
.ranklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ranklist li { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto 1.2em; gap: 8px; align-items: center; padding: 4px 8px; background: var(--night); font-size: 14px; }
.ranklist li.me { outline: 2px solid var(--bronze); }
.ranklist .pos { font-family: var(--f-latin); color: var(--muted); }
.ranklist li:nth-child(1) .pos { color: var(--bronze); }
.ranklist .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranklist .rec { font-family: var(--f-latin); font-size: 12px; font-variant-numeric: tabular-nums; white-space: pre; }
.ranklist .star { color: var(--bronze); }
.rank-nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.rank-nav h2 { font-size: 20px; text-align: center; }
.rank-nav button { background: var(--panel-2); border: 2px solid var(--line); width: 40px; height: 40px; }
.chap { margin: 4px 0 -4px; font-size: 13px; color: var(--bronze); }
.ranklist.recs li { grid-template-columns: 3.6em minmax(0, 1fr) auto 1.2em; }
.grid-stages .best { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.grid-stages em { font-style: normal; color: var(--bronze); }
.card { max-height: calc(100vh - 40px); overflow-y: auto; }

@media (max-width: 380px) {
  .stage-name { font-size: 16px; }
  .ibtn { padding: 0 7px; }
  .slot .nm { font-size: 9px; }
  .acts button { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .board.shake { animation: none; }
}
</style>

<main class="app">

<script id="logic-src">
// ===== Game logic (pure, no DOM) =====
const ITEM_OF = { H: 'helm', S: 'harpe', W: 'sandal', M: 'shield', N: 'head', Y: 'trident' };
const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const DIR_ORDER = ['U', 'R', 'D', 'L'];
const HELM_TURNS = 7;
const SHIELD_TURNS = 4;
const WAKE_DIST = 3;

function parseLevel(lv) {
  const rows = lv.map;
  const h = rows.length, w = rows[0].length;
  const grid = [];
  const mobs = [];
  let player = null, medusa = null, id = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = rows[y][x];
      if (c === 'P') { player = { x, y, dir: 'D' }; grid.push('.'); }
      else if (c === 'm') { mobs.push({ id: id++, x, y, kind: 'shade', awake: false, stun: 0, fresh: false }); grid.push('.'); }
      else if (c === 'a') { mobs.push({ id: id++, x, y, kind: 'shade', awake: true, stun: 0, fresh: false }); grid.push('.'); }
      else if (c === 'z') { mobs.push({ id: id++, x, y, kind: 'sister', awake: false, stun: 0, fresh: false }); grid.push('.'); }
      else if (c === 'G') { medusa = { x, y, alive: true }; grid.push('.'); }
      else grid.push(c);
    }
  }
  return {
    w, h, grid, player, hearts: 3, maxHearts: 3,
    inv: { helm: 0, harpe: 0, sandal: 0, shield: 0, head: 0, trident: 0 },
    sea: lv.sea ? (lv.sea === 'high' ? 1 : 0) : -1, statues: [],
    keys: 0, mobs, medusa, invis: 0, shieldT: 0, armed: false,
    turn: 0, status: 'play', cause: '', msg: '', events: []
  };
}

function clone(s) {
  return {
    w: s.w, h: s.h, grid: s.grid.slice(), player: { x: s.player.x, y: s.player.y, dir: s.player.dir },
    hearts: s.hearts, maxHearts: s.maxHearts, inv: { helm: s.inv.helm, harpe: s.inv.harpe, sandal: s.inv.sandal, shield: s.inv.shield, head: s.inv.head, trident: s.inv.trident },
    sea: s.sea, statues: s.statues.map(t => ({ x: t.x, y: t.y, kind: t.kind, dir: t.dir, under: t.under })),
    keys: s.keys, mobs: s.mobs.map(m => ({ id: m.id, x: m.x, y: m.y, kind: m.kind, awake: m.awake, stun: m.stun, fresh: m.fresh })),
    medusa: s.medusa ? { x: s.medusa.x, y: s.medusa.y, alive: s.medusa.alive } : null,
    invis: s.invis, shieldT: s.shieldT, armed: s.armed, turn: s.turn, status: s.status, cause: s.cause, msg: s.msg, events: []
  };
}
// compact identity of a position (for searching); ignores turn count and messages
function stateKey(s) {
  let k = s.player.x + ',' + s.player.y + s.player.dir + s.hearts + '|' + s.inv.helm + s.inv.harpe + s.inv.sandal + s.inv.shield + s.inv.head + s.inv.trident + s.keys + '|' + s.sea + '|' + s.invis + ',' + s.shieldT + (s.armed ? 'a' : '') + (s.medusa && s.medusa.alive ? 'G' : '') + '|';
  for (const m of s.mobs) k += m.id + ':' + m.x + ',' + m.y + (m.awake ? 'w' : '') + m.stun + (m.fresh ? 'f' : '') + ';';
  return k + '|' + s.grid.join('');
}
function tile(s, x, y) { return (x < 0 || y < 0 || x >= s.w || y >= s.h) ? '#' : s.grid[y * s.w + x]; }
function setTile(s, x, y, c) { s.grid[y * s.w + x] = c; }
function isSolid(c) { return c === '#' || c === 'I' || c === 'T'; }
// the sea: shallows (w) are dry at low tide and under water at high tide. Poseidon's trident switches it.
function tideHigh(s) { return s.sea === 1; }
function mobAt(s, x, y) { return s.mobs.findIndex(m => m.x === x && m.y === y); }
function medusaAt(s, x, y) { return !!(s.medusa && s.medusa.alive && s.medusa.x === x && s.medusa.y === y); }
function exitOpen(s) { return !s.medusa || !s.medusa.alive; }

function playerCanEnter(s, x, y) {
  const c = tile(s, x, y);

  if (c === 'D' && s.keys <= 0) return false;

function gazeTiles(s) {
  const out = [];
  if (!s.medusa || !s.medusa.alive) return out;
  for (const d of DIR_ORDER) {
    const [dx, dy] = DIRS[d];
    let x = s.medusa.x + dx, y = s.medusa.y + dy;
    while (true) {

function bfsStep(s, mob) {
  const px = s.player.x, py = s.player.y, W = s.w;
  const prev = new Int32Array(s.w * s.h).fill(-2);
  const start = mob.y * W + mob.x, goal = py * W + px;

  for (let qi = 0; qi < q.length; qi++) {
    const cur = q[qi];
    if (cur === goal) {
      let c = cur;
      while (prev[c] !== start) { if (prev[c] < 0) return null; c = prev[c]; }
      return [c % W, (c / W) | 0];
    }
    const x = cur % W, y = (cur / W) | 0;
    for (const d of DIR_ORDER) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= s.h) continue;

      if (k === goal || mobCanEnter(s, nx, ny)) { prev[k] = cur; q.push(k); }

// 歩いて何マスで届くか（壁・奈落・ツタ・扉ごしには気づかない）。limitを超えたらInfinity
function walkDist(s, sx, sy, tx, ty, limit) {
  let frontier = [[sx, sy]];
  const seen = new Set([sy * s.w + sx]);
  for (let d = 0; d <= limit; d++) {
    const next = [];
    for (const [x, y] of frontier) {
      if (x === tx && y === ty) return d;
      for (const k of DIR_ORDER) {
        const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
        const c = tile(s, nx, ny), id = ny * s.w + nx;
        if (seen.has(id) || isSolid(c) || c === 'O' || c === 'V' || c === 'D' || c === '~' || (c === 'w' && tideHigh(s))) continue;

// the sea rises: whoever stands in the shallows is swept away
function sweep(s) {

}

// push a statue one tile; it sinks and becomes floor when pushed into the sea or a pit
function pushStatue(s, x, y, dx, dy) {
  const si = s.statues.findIndex(t => t.x === x && t.y === y);
  if (si < 0) return false;
  const st = s.statues[si];

  if (!sinks && !slides) return false;
  setTile(s, x, y, st.under);
  if (sinks) {
    setTile(s, bx, by, '.');
    s.statues.splice(si, 1);
    s.events.push({ t: 'sink', x: bx, y: by });
    s.msg = '石像が沈み、足場になった';
  } else {
    st.under = b; st.x = bx; st.y = by;
    setTile(s, bx, by, 'T');
    s.events.push({ t: 'push' });
  }
  return true;
}

function pickup(s) {
  const { x, y } = s.player;
  const c = tile(s, x, y);
  if (c === 'K') { s.keys++; setTile(s, x, y, '.'); s.msg = '青銅の鍵を手に入れた'; s.events.push({ t: 'pick', x, y }); }
  else if (ITEM_OF[c]) {
    const it = ITEM_OF[c];
    s.inv[it]++; setTile(s, x, y, '.');
    s.msg = ITEM_NAME[it] + 'を手に入れた';
    s.events.push({ t: 'pick', x, y, item: it });
  }
}

const ITEM_NAME = { helm: 'ハデスの兜', harpe: 'ハルペーの鎌', sandal: '翼のサンダル', shield: '鏡の盾', head: 'メドゥーサの首', trident: 'ポセイドンの三叉槍' };

// Returns new state. If the action is not possible, returns a state with turn unchanged (msg explains).
function act(s0, a) {
  if (s0.status !== 'play') return s0;
  const s = clone(s0);
  s.events = []; s.msg = '';
  const p = s.player;

  if (DIRS[a]) {
    const [dx, dy] = DIRS[a];
    p.dir = a;
    if (s.armed) {
      const mc = tile(s, p.x + dx, p.y + dy);
      const tx = p.x + 2 * dx, ty = p.y + 2 * dy;
      if (isSolid(mc) || mc === 'D' || medusaAt(s, p.x + dx, p.y + dy)) { s.msg = '壁は飛び越えられない'; return s; }
      if (!playerCanEnter(s, tx, ty) || tile(s, tx, ty) === 'D') { s.msg = 'そこには着地できない'; return s; }

      s.inv.sandal--; s.armed = false;
      s.events.push({ t: 'jump' });

      const nx = p.x + dx, ny = p.y + dy;
      if (tile(s, nx, ny) === 'T') {
        if (!pushStatue(s, nx, ny, dx, dy)) { s.msg = '石像はこれ以上押せない'; return s; }
      }
      if (!playerCanEnter(s, nx, ny)) {
        const c = tile(s, nx, ny);
        if (mobAt(s, nx, ny) >= 0) s.msg = '敵が道をふさいでいる';
        else if (c === 'V') s.msg = 'ツタが絡みついて進めない';
        else if (c === 'O') s.msg = '奈落だ。歩いては渡れない';
        else if (c === 'D') s.msg = '扉には鍵がかかっている';

    endTurn(s); return s;

    s.inv.shield--; s.shieldT = SHIELD_TURNS;
    s.msg = '鏡の盾を構えた'; s.events.push({ t: 'shield' });
    endTurn(s); return s;
  }

  if (a === 'head') {
    if (s.inv.head <= 0) { s.msg = 'メドゥーサの首を持っていない'; return s; }

      const mi = mobAt(s, x, y);
      if (mi >= 0) {
        const m = s.mobs[mi];
        if (m.kind === 'sister') gorgon = true;
        else {
          s.mobs.splice(mi, 1);
          s.statues.push({ x, y, kind: m.kind, dir: p.dir, under: tile(s, x, y) });
          setTile(s, x, y, 'T');
          s.events.push({ t: 'stone', x, y });
          hit++;

      x += dx; y += dy;
    }
    if (!hit) { s.msg = gorgon ? 'ゴーゴンに首の力は効かない' : '首を向けた先に敵がいない'; return s; }

    endTurn(s); return s;
  }

  if (a === 'trident') {
    if (s.inv.trident <= 0) { s.msg = 'ポセイドンの三叉槍を持っていない'; return s; }
    if (s.sea < 0) { s.msg = 'ここには海がない'; return s; }
    if (s.sea === 0 && tile(s, p.x, p.y) === 'w') { s.msg = '浅瀬の上で潮を満たせば、自分がのまれてしまう'; return s; }

        endTurn(s); return s;

      if (mi >= 0) {
        if (s.mobs[mi].kind === 'sister') { sawSister = true; continue; }
        s.mobs.splice(mi, 1);
        s.inv.harpe--; p.dir = d;
        s.msg = 'スパルトイを打ち砕いた'; s.events.push({ t: 'kill', x, y });
        endTurn(s); return s;

        s.inv.harpe--; p.dir = d;
        s.msg = 'ツタを断ち切った'; s.events.push({ t: 'cut', x, y });
        endTurn(s); return s;

    return s;
  }

}

const MOVE_CODE = { U: 'U', D: 'D', L: 'L', R: 'R', wait: 'W', helm: 'H', harpe: 'K', sandal: 'S', shield: 'M', head: 'N', trident: 'P' };

  let s = parseLevel(lv);

<script>
(() => {
'use strict';
// ---------- palette & sprites ----------
const T = 16;      // art pixels per tile
const CH = 24;     // character sprite height (characters stand taller than a tile)
const PAL = {
  k: '#1a1430', w: '#f6eedb', v: '#c9bda3', g: '#e8b84e', h: '#fff0a8', n: '#a87a2a',
  b: '#b0743a', B: '#6e4224', r: '#d64b3f', R: '#8a2a2a', s: '#f4c79c', u: '#cf9168', x: '#4a2e1c',
  c: '#7fe3ef', C: '#2f8fa6', p: '#6c4fa3', P: '#a68ad8', q: '#3b2a63',
  e: '#86d36f', E: '#2f7a40', j: '#c3e0a8', J: '#86a874', o: '#e07d3a', O: '#9b4a1e',
  y: '#9a9fbb', Y: '#e9e6d6', z: '#312a52', t: '#ffffff',
  X: '#7b4a28', l: '#a86b3c'
};
const pad = (rows, w = 16) => rows.map(r => r.padEnd(w, '.').slice(0, w));
const mirror = half => half.map(hf => { const a = hf.padEnd(8, '.').slice(0, 8); return a + [...a].reverse().join(''); });
const swapC = (rows, m) => rows.map(r => [...r].map(c => m[c] || c).join(''));
function editRows(rows, fn) { const g = rows.map(r => [...r]); fn(g); return g.map(r => r.join('')); }
const put = (g, x, y, c) => { if (g[y] && x >= 0 && x < g[y].length) g[y][x] = c; };

// ----- Perseus (16x24) -----
// Perseus: a light young traveller (curly hair, red headband and scarf, white chiton). Divine gear appears only once picked up.
const HERO_FRONT = ['....kkkk', '..kkXlXX', '.kXXlXXl', '.kXlXXXX', 'kXXXXlXX', '.kXrrrrg', '.kXxssss', '.kXskkss', '.kxswkss', '..kssssu', '...kssss', '....kuss',
  '..krrrrr', '.krRrrRr', '.kskwwww', '.kskwwww', '.kbkgggg', '.kskwwwv', '..kkwwwv', '...kvwwv'];
const HERO_BACK = ['....kkkk', '..kkXlXX', '.kXXlXXl', '.kXlXXXX', 'kXXXXlXX', '.kXrrrRR', '.kXXXXrR', '.kXXlXXR', '.kXXXXlX', '..kXXXXX', '...kXXXX', '....kuss',
  '..krrrrr', '.krRrrrr', '.kskwwrr', '.kskwwrR', '.kbkggRr', '.kskwwwr', '..kkwwwv', '...kvwwv'];
const LEGS_A = ['....kssk', '....ksuk', '...kbbbk', '...kBBBk'];
const LEGS_B = ['.....ksk', '.....ksk', '....kbbk', '....kBBk'];
const heroFront = legs => mirror([...HERO_FRONT, ...legs]);
const heroBack = legs => mirror([...HERO_BACK, ...legs]);
const HERO_SIDE = ['......kkkk', '....kkXlXXk', '...kXXlXXXlk', '..kXlXXXXXXXk', '..kXXXXXlXXXk', '..kXXXrrrrrgk', '..kXXXxssssk', '..kXXXxskksk', '..kXXxsswkssk', '...kXxssssuk', '....kxssssk', '.....kussk',
  '....krrrrk', '...krRrrRk', '....kwwwsk', '....kwwwsk', '....kgggbk', '....kwwwsk', '....kvwwwk', '....kvwwvk'];
const SIDE_A = ['....ksk.ksk', '....ksk.ksk', '...kbbk.kbbk', '...kBBk.kBBk'];
const SIDE_B = ['.....kssk', '.....kssk', '.....kbbbk', '.....kBBBk'];
// headband and scarf tails flutter behind him, differently on each step
const heroSide = (legs, f) => editRows(pad([...HERO_SIDE, ...legs]), g => {
  if (f === 0) { put(g, 0, 5, 'r'); put(g, 1, 5, 'R'); put(g, 1, 6, 'r'); put(g, 2, 12, 'r'); put(g, 1, 13, 'r'); put(g, 2, 13, 'R'); }
  else { put(g, 0, 4, 'r'); put(g, 1, 4, 'r'); put(g, 1, 5, 'R'); put(g, 1, 12, 'r'); put(g, 2, 12, 'r'); put(g, 2, 13, 'R'); }
});
// gear that shows on Perseus when he carries it
const GEAR = {
  harpe: ['..YYY..', '.Y...Y.', '......Y', '.....Y.', '....Y..', '...B...', '..B....'],
  shieldBack: ['..kkkk..', '.kgggggk'.slice(0, 8), 'kgccccgk', 'kgcwccgk', 'kgcccCgk', 'kgccCCgk', '.kgCCgk.', '..kkkk..'],
  helmHead: ['....kkkk....', '..kkyYYykk..', '.kyYYYYYYyk.', '.kyYyyyyYyk.', '.kyykkkkyyk.', '.ky.kkkk.yk.', '..k......k..'],
};

// ----- Spartoi, the dragon-tooth warriors (16x24) -----
const SP_HALF = ['........', '........', '......kk', '.....kRR', '....kbbb', '...kbbgb', '...kbkrk', '...kbBkk', '...kbYYY', '....kYkY', '......ky',
  '..kYkbbb', '.kYkbggb', '.kYkbbbb', '.kykbBbb', '.kYkBbbb', '..kYkBBB', '....kRRR', '....kRkR', '....kYk.', '....kYk.', '....kyk.', '...kbbk.', '...kkkk.'];
const spartoiBase = mirror(SP_HALF);
function addShieldSpear(rows, shieldLeft) {
  return editRows(rows, g => {
    // spear
    const sx = shieldLeft ? 14 : 1;
    for (let y = 2; y <= 21; y++) put(g, sx, y, 'B');
    put(g, sx, 0, 'Y'); put(g, sx, 1, 'Y'); put(g, sx - 1, 2, 'y'); put(g, sx + 1, 2, 'y');
    // round bronze shield
    const cx = shieldLeft ? 3 : 12, cy = 15;
    for (let y = -4; y <= 4; y++) for (let x = -3; x <= 3; x++) {
      const d = x * x / 9 + y * y / 16;
      if (d <= 1.05) put(g, cx + x, cy + y, d > 0.6 ? 'g' : 'b');
    }
    for (let y = -4; y <= 4; y++) for (let x = -4; x <= 4; x++) { const d = x * x / 12 + y * y / 22; if (d > 0.95 && d < 1.25) put(g, cx + x, cy + y, 'k'); }
    put(g, cx, cy, 'R'); put(g, cx, cy - 1, 'R'); put(g, cx - 1, cy, 'R'); put(g, cx + 1, cy, 'R'); put(g, cx, cy + 1, 'R');
  });
}
const spartoiFront = addShieldSpear(spartoiBase, true);
const spartoiBack = addShieldSpear(editRows(spartoiBase, g => { for (const y of [6, 7]) for (let x = 4; x <= 11; x++) put(g, x, y, 'b'); put(g, 7, 8, 'k'); put(g, 8, 8, 'k'); }), false);
const spartoiSide = addShieldSpear(editRows(spartoiBase, g => { for (let x = 4; x <= 11; x++) { put(g, x, 6, 'b'); put(g, x, 7, 'b'); } put(g, 9, 6, 'k'); put(g, 10, 6, 'r'); put(g, 11, 6, 'k'); put(g, 10, 7, 'k'); put(g, 11, 7, 'k'); }), false);
const spartoiSleep = editRows(spartoiFront, g => { put(g, 6, 6, 'k'); put(g, 9, 6, 'k'); });

// ----- Gorgons (16x24) -----
const G_TOP = ['....e...', '..e.Ee..', '..EeEE.e', '.eEEeEEe'];
const G_MID = ['e...e...', 'Ee.eEe.e', '.EeEeEeE', 'eEEeeEEe', '.eEEEkkk', '.eEEkjjj', 'eEEkjrkj', '.eEkjjjj', '.eEkjjkk', 'gh.ekJJJ', 'ghgkoooo', 'gggkoggo', '.ggkoooo', '..gkoggo', '...kEEEE', '....kEEk'];
const G_TAIL = ['...kEEeE', '..kEEeEE', '..kEeEEk', '...kkkk.'];
const sisterFront = mirror([...G_TOP, ...G_MID, ...G_TAIL]);
const faceToHair = rows => editRows(rows, g => { for (let y = 8; y <= 12; y++) for (let x = 4; x <= 11; x++) g[y][x] = (x + y) % 3 ? 'E' : 'e'; });

async function submitScore(i, rec) {
  if (!rank.db || !rank.uid || rank.readOnly) return;
  const mine = rank.docs[rank.uid] || {};
  const prev = mine['s' + i];
  if (prev && !better(rec, prev)) return;
  const body = {};
  for (const key of Object.keys(mine)) if (/^s\d+$/.test(key) && mine[key] && typeof mine[key].t === 'number') body[key] = { t: mine[key].t, h: mine[key].h, at: mine[key].at || 0 };

function onWin() {

  if (hintUsed) rec.a = true;
  const prev = progress.best[LEVELS[stageIdx].id];

      if (!m.awake) {
        const ph = Math.floor(t / 420 + m.id) % 3;
        const zx = X + 12 + ph, zy = Y - 1 - ph * 2;
        px(zx, zy, 3, 1, PAL.Y); px(zx + 1, zy + 1, 1, 1, PAL.Y); px(zx, zy + 2, 3, 1, PAL.Y);
      } else if (m.stun > 0) {
        const ph = Math.floor(t / 140) % 2;
        px(X + 3 + ph * 8, Y - 1, 2, 2, PAL.h); px(X + 11 - ph * 8, Y - 3, 1, 1, PAL.h);
      } else if (frozen) {
        px(X + 6, Y - 2, 4, 1, PAL.c); px(X + 7, Y - 3, 2, 3, PAL.c);
      }
    } });
  }
  drawables.push({ y: pY + 0.01, fn: () => {
    const dir = s.player.dir;
    const set = IMG.hero[dir] || IMG.hero.D;
    const img = midStep ? (set[1 + (s.turn % 2)] || set[1] || set[0]) : set[0];
    const X = pX * T, Y = pY * T;
    tileMark(X, Y, '#ffe08a');
    shadow(X, Y, lift > 0 ? 7 : 11);
    const alpha = s.invis > 0 ? 0.35 + 0.1 * Math.sin(t / 120) : 1;
    const yy = Y - lift;
    if (s.status === 'lose' && s.cause === 'petrify') { ctx.filter = 'grayscale(1) brightness(1.15)'; drawChar(img, X, Y); ctx.filter = 'none'; return; }
    const hasShield = s.inv.shield > 0, raised = s.shieldT > 0, hasHarpe = s.inv.harpe > 0;
    const gear = (im, gx, gy, sz, a) => { ctx.globalAlpha = a; ctx.drawImage(im, Math.round(gx * 2) / 2, Math.round(gy * 2) / 2, sz, sz); ctx.globalAlpha = 1; };
    // gear carried behind the body
    if (hasShield && !raised && dir !== 'U') gear(IMG.shield, X + (dir === 'D' ? 10 : dir === 'R' ? -1 : 9), yy + 6, 7, alpha);
    if (hasHarpe && dir === 'U') gear(IMG.harpeL, X - 1, yy + 6, 7, alpha);
    drawChar(img, X, yy, alpha);
    // gear in front
    if (hasShield && !raised && dir === 'U') gear(IMG.shield, X + 4, yy + 6, 8, alpha);
    if (raised) gear(IMG.shield, X + (dir === 'L' ? 0 : dir === 'R' ? 8 : 4), yy + 6, 8, alpha);
    if (hasHarpe && dir !== 'U') gear(dir === 'L' ? IMG.harpeL : IMG.harpe, X + (dir === 'L' ? -1 : dir === 'R' ? 10 : 11), yy + 6, 7, alpha);
    if (s.invis > 0) gear(IMG.helm, X + 3, yy - 2, 10, Math.min(1, alpha + 0.35));
    if (s.armed) { const f = Math.floor(t / 120) % 2; px(X + 1, yy + 12 - f, 2, 2, '#ffffff'); px(X + 13, yy + 12 - f, 2, 2, '#ffffff'); px(X, yy + 11 - f, 1, 1, '#ffffff'); px(X + 15, yy + 11 - f, 1, 1, '#ffffff'); }
    else if (s.inv.sandal > 0) { ctx.globalAlpha = alpha; px(X + 3, yy + 14, 2, 1, '#ffffff'); px(X + 11, yy + 14, 2, 1, '#ffffff'); ctx.globalAlpha = 1; }
    if (raised) {
      ctx.globalAlpha = 0.45 + 0.3 * Math.sin(t / 100);
      ctx.strokeStyle = PAL.c; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.ellipse(X + 8, Y + 8 - lift, 9, 9, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } });
  drawables.sort((a, b) => a.y - b.y).forEach(d => d.fn());
  // hint arrow
  if (hintMark && performance.now() - hintMark.t0 < 2200 && !anim) {
    const d = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] }[hintMark.dir], dist = hintMark.jump ? 2 : 1;
    const hx = (s.player.x + d[0] * dist) * T, hy = (s.player.y + d[1] * dist) * T;
    if (Math.floor(t / 200) % 2) {
      ctx.strokeStyle = PAL.h; ctx.lineWidth = 1; ctx.strokeRect(hx + 0.5, hy + 0.5, T - 1, T - 1);
      for (let i = 0; i < 4; i++) px(hx + 8 - 1 + d[0] * (i - 2) * 1.5 - (d[1] ? i : 0) * 0, hy + 8 - 1 + d[1] * (i - 2) * 1.5, 2, 2, PAL.h);
    }
  } else if (hintMark && anim) hintMark = null;
  // wake "!"
  for (let i = wakeMarks.length - 1; i >= 0; i--) {
    const w = wakeMarks[i], age = t - w.t0;
    if (age > 800) { wakeMarks.splice(i, 1); continue; }
    const m = s.mobs.find(o => o.id === w.id);
    if (!m) continue;
    const X = m.x * T + 7, Y = m.y * T - 9 - Math.min(2, age / 60);
    px(X - 1, Y - 1, 4, 9, PAL.k); px(X, Y, 2, 5, PAL.h); px(X, Y + 6, 2, 1, PAL.h);
  }
  // dust in the air (screen space)
  if (!overview) {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    const vw = view.w * T, vh = view.h * T;
    for (const m of motes) {
      m.x = (m.x + m.vx + vw) % vw; m.y = (m.y + m.vy + vh) % vh;
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(t / 700 + m.ph); px(Math.round(m.x), Math.round(m.y), 1, 1, '#efe2c2'); ctx.globalAlpha = 1;
    }
    ctx.setTransform(sc, 0, 0, sc, ox, oy);
  }
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.03;
    ctx.globalAlpha = Math.max(0, p.life); px(Math.round(p.x), Math.round(p.y), p.sz, p.sz, p.c); ctx.globalAlpha = 1;
  }
  renderLights(s, t, [pX, pY - lift / T], sc, ox, oy);
  ctx.setTransform(sc, 0, 0, sc, ox, oy);
  if (!anim && !overview) drawForecast(s, t);
  if (s.invis > 0) { ctx.globalAlpha = 0.12; px(0, 0, s.w * T, s.h * T, '#6c4fa3'); ctx.globalAlpha = 1; }
  requestAnimationFrame(render);
}

// load the 32x32 sprite strips, then start
function loadArt() {
  const load = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = src; });
  return Promise.all(Object.entries(SHEETS).map(([k, src]) => load(src).then(im => [k, im]))).then(list => {
    const sh = Object.fromEntries(list);
    const cut = (im, i, flip) => { const c = document.createElement('canvas'); c.width = 32; c.height = 32; const x = c.getContext('2d'); if (flip) { x.translate(32, 0); x.scale(-1, 1); } x.drawImage(im, i * 32, 0, 32, 32, 0, 0, 32, 32); return c; };
    const dirs = (im, n) => ({ D: [...Array(n)].map((_, i) => cut(im, i)), U: [...Array(n)].map((_, i) => cut(im, n + i)), R: [...Array(n)].map((_, i) => cut(im, 2 * n + i)), L: [...Array(n)].map((_, i) => cut(im, 3 * n + i)) });
    if (sh.hero) IMG.hero = dirs(sh.hero, 3);
    if (sh.spartoi) IMG.spartoi = dirs(sh.spartoi, 2);
    if (sh.gorgon) IMG.sister = dirs(sh.gorgon, 2);
    if (sh.medusa) IMG.medusa = cut(sh.medusa, 0);
    if (sh.tiles) {
      TILE = {};
      ['floor1', 'floor2', 'wallTop', 'wallFace', 'pillar', 'pit', 'vine', 'door', 'exit', 'sealed', 'torch'].forEach((k, i) => {
        const c = document.createElement('canvas'); c.width = 32; c.height = 40;
        c.getContext('2d').drawImage(sh.tiles, i * 32, 0, 32, 40, 0, 0, 32, 40); TILE[k] = c;
      });
      if (sh.floor && sh.wallface && sh.torchov && sh.objects) {
        GROUND = { floor: sh.floor, face: sh.wallface, torch: sh.torchov };
        ['pillar', 'pit', 'vine', 'door', 'exit', 'sealed'].forEach((k, i) => {
          const c = document.createElement('canvas'); c.width = 32; c.height = 40;
          c.getContext('2d').drawImage(sh.objects, i * 32, 0, 32, 40, 0, 0, 32, 40); TILE[k] = c;
        });
      }
    }
    if (sh.items) ['helm', 'harpe', 'sandal', 'shield', 'key'].forEach((k, i) => { IMG[k] = cut(sh.items, i); IMG[k + 'L'] = cut(sh.items, i, true); URL_OF[k] = IMG[k].toDataURL(); });
    if (sh.sea) {
      const tileCut = i => { const c = document.createElement('canvas'); c.width = 32; c.height = 32; c.getContext('2d').drawImage(sh.sea, i * 32, 0, 32, 32, 0, 0, 32, 32); return c; };
      SEA = { deep: tileCut(0), low: tileCut(1), high: tileCut(2) };
      IMG.trident = cut(sh.sea, 3); IMG.head = cut(sh.sea, 4); URL_OF.trident = IMG.trident.toDataURL(); URL_OF.head = IMG.head.toDataURL();
    }
    if (sh.terrain) TER = sh.terrain;
    if (sh.title) OPIMG.title = sh.title;
    for (const k of ['op2_sea', 'op2_rock', 'op2_coast']) if (sh[k]) OPIMG[k] = sh[k];
    if (sh.ch2chars) {
      const cc = (x, y, w) => { const c = document.createElement('canvas'); c.width = w; c.height = w; c.getContext('2d').drawImage(sh.ch2chars, x, y, w, w, 0, 0, w, w); return c; };
      OPIMG.cetus = cc(128, 0, 64); OPIMG.andromeda = cc(192, 32, 32);
    }
    if (sh.terrain) { // a stand-in seascape until a painted background arrives
      const c = document.createElement('canvas'); c.width = 192; c.height = 320; const x = c.getContext('2d');
      for (let yy = 0; yy < 320; yy += 64) for (let xx = 0; xx < 192; xx += 64) x.drawImage(sh.terrain, 192, 0, 64, 64, xx, yy, 64, 64);
      const g = x.createLinearGradient(0, 0, 0, 320); g.addColorStop(0, 'rgba(5,4,20,0.9)'); g.addColorStop(0.35, 'rgba(5,4,20,0)'); x.fillStyle = g; x.fillRect(0, 0, 192, 320);
      OPIMG.sea = c;
    }
    if (sh.title) $('title').style.backgroundImage = 'url(' + SHEETS.title + ')';
    URL_OF.spartoi = IMG.spartoi.D[0].toDataURL();
  });
}
function showTitle() {
  $('title').hidden = false;
  $('tContinue').hidden = !(progress.unlocked > 0);
}
function leaveTitle(i, menu) { $('title').hidden = true; if (menu) { openCard('menu'); return; } startStage(i); }
$('tContinue').addEventListener('click', () => leaveTitle(Math.min(progress.unlocked, LEVELS.length - 1)));
$('tNew').addEventListener('click', () => leaveTitle(0));
$('tSelect').addEventListener('click', () => leaveTitle(stageIdx, true));
loadArt().then(() => { startStage(stageIdx, false); showTitle(); requestAnimationFrame(render); });
})();
</script>
